name: Bug
description: Concord fails, crashes or misroutes traffic, reproduced with the standalone CLI on the latest version.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Concord follows mihomo, and sing-box or another reference for what mihomo does not have. A report needs the
        same setup's behaviour under that reference; without it a compatibility problem cannot be judged. Incomplete
        reports are labelled `needs-info` and closed after 7 days.
  - type: input
    id: version
    attributes:
      label: Concord version
      description: The release tag (`v1.2.3`) or the full commit hash of the current `main`.
    validations:
      required: true
  - type: dropdown
    id: run-mode
    attributes:
      label: How Concord runs
      options:
        - Standalone CLI (concord run)
        - Embedded in a host application
        - C ABI (libconcord)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Android
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS version and architecture
      placeholder: Ubuntu 26.04, arm64
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Minimal configuration
      description: The smallest profile that shows the problem.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Debug log
      description: "The log around the failure, with `log-level: debug` in the profile."
      render: text
    validations:
      required: true
  - type: dropdown
    id: reference-source
    attributes:
      label: Reference
      description: >-
        mihomo, unless mihomo does not have the feature. Then sing-box, or for anything else (Xray, a specification)
        Other, naming it in the version below.
      options:
        - mihomo
        - sing-box
        - Other
    validations:
      required: true
  - type: input
    id: reference-version
    attributes:
      label: Reference version
      description: The release or commit you ran the same setup with, such as mihomo `v1.19.15` or sing-box `1.12.8`.
    validations:
      required: true
  - type: textarea
    id: reference-behaviour
    attributes:
      label: Behaviour under the reference
      description: What the same setup does there; for sing-box or Other, include the configuration you ran it with.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I reproduced this on the latest release or the current `main`.
          required: true
        - label: I removed servers, passwords, UUIDs, keys and subscription URLs from the configuration and log.
          required: true
        - label: I reproduced this with the standalone `concord run`, so it is not a problem of a host application.
          required: true
        - label: I searched the existing issues, open and closed.
          required: true
        - label: This issue reports one problem.
          required: true
